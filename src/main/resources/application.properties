spring.application.name=payroll
server.port=1305

# Database or DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=payroll_user
spring.datasource.password=123456
spring.datasource.url=jdbc:postgresql://localhost:1303/payroll_db

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Keycloak JWT validation. The realm matches the existing Compose configuration.
# Explicit JWK URI avoids requiring Keycloak discovery during API startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:1304/realms/ecommerce}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:1304/realms/ecommerce/protocol/openid-connect/certs}
